# Global daemon settings
daemon:
  mode: "daemon" # "daemon" or "one-shot"
  check_interval: "1m" # How often to check tokens (daemon mode only)
  dry_run: false # If true, no actual changes are made

# Rotation behavior
rotation:
  threshold_percent: 98 # Rotate when <=98% of validity remains

# Vault configuration
# Environment variables are automatically expanded using ${VAR_NAME} or $VAR_NAME syntax
vault:
  address: "http://vault:8200"
  role_id: "${VAULT_ROLE_ID}" # Expanded from VAULT_ROLE_ID environment variable
  secret_id: "${VAULT_SECRET_ID}" # Expanded from VAULT_SECRET_ID environment variable
  mount_path: "infra" # KV v2 mount path

# Observability settings
observability:
  otel_endpoint: "otel-collector:4317" # OpenTelemetry collector endpoint (optional)
  log_level: "debug" # debug, info, warn, error

# Token definitions
tokens:
  - label: "token-four" # Must match the token's label in Cloud Manager/API
    team: "me"
    validity: "30d" # Must be <= 6 months (180d)
    scopes: "monitor:read_only" # "*" for all scopes, or comma-separated list
    storage:
      - type: "vault"
        path: "latr/secondary/token-four"

  - label: "token-five"
    team: "me"
    validity: "30d"
    scopes: "nodebalancers:read_only"
    storage:
      - type: "vault"
        path: "latr/secondary/token-five"

  - label: "token-six"
    team: "me"
    validity: "30d"
    scopes: "*"
    storage:
      - type: "vault"
        path: "latr/secondary/token-six"
